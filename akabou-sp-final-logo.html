<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あかぼう｜緊急配送</title>
<style>
  :root {
    --red: #d62a2a;
    --red-dark: #b81f1f;
    --navy: #1b3a5c;
    --gray: #4b4b4b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    color: #222;
    background: #fff;
    -webkit-text-size-adjust: 100%;
  }

  /* ヘッダー */
  .site-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 6px solid var(--gray);
  }
  .logo {
    flex: 0 0 auto;
    height: 64px;
    width: auto;
    display: block;
  }
  .tagline {
    flex: 1 1 auto;
    font-size: 15px;
    color: var(--gray);
    line-height: 1.4;
  }
  .lang {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    font-size: 12px;
  }
  .lang a {
    color: var(--gray);
    text-decoration: none;
  }

  /* ヒーロー画像 */
  .hero {
    padding: 24px 16px;
  }
  .hero img {
    display: block;
    width: 100%;
    height: auto;
    max-width: 100%;
  }

  /* 緊急配送バナー */
  .banner {
    background: var(--red);
    color: #fff;
    padding: 16px 14px 14px;
    text-align: center;
  }
  .banner-title {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 6px 12px;
    margin: 0;
    line-height: 1.2;
  }
  .banner-title .main {
    font-size: clamp(36px, 11vw, 52px);
    font-weight: 900;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  .banner-title .sub {
    font-size: clamp(16px, 4.8vw, 22px);
    font-weight: 700;
  }
  .banner-call {
    margin: 8px 0 0;
    font-size: clamp(24px, 7.5vw, 34px);
    font-weight: 900;
    line-height: 1.3;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  .banner-call .icon { font-size: 0.9em; }

  /* 電話番号グリッド */
  .phones {
    background: var(--red-dark);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px;
    border-top: 2px solid #fff;
    border-bottom: 6px solid var(--gray);
  }
  .tel {
    display: block;
    background: var(--red);
    color: #fff;
    text-decoration: none;
    padding: 12px 12px 14px;
  }
  .tel:active { background: var(--red-dark); }
  .tel .label {
    display: block;
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .tel .number {
    display: block;
    font-size: clamp(16px, 4.6vw, 22px);
    font-weight: 700;
    letter-spacing: 0.02em;
    text-align: center;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  /* 東京は横長で最上段、他4拠点は2列 */
  .phones {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  .tel:first-child {
    grid-column: 1 / -1;
  }
  .tel:first-child .number {
    font-size: clamp(22px, 6.5vw, 30px);
  }

  /* フッター */
  .site-footer {
    background: var(--navy);
    color: #fff;
    text-align: center;
    padding: 16px 12px;
    font-size: 12px;
  }
</style>
</head>
